name: BOUCLE — cycle cybernétique

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: ecritures-depot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Mesurer, comparer, corriger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 sentinel/boucle.py
      - name: Publier l'état de la boucle
        run: |
          git config user.name "BOUCLE"
          git config user.email "boucle@users.noreply.github.com"
          git add sentinel/boucle.json
          if git diff --staged --quiet; then echo "état inchangé"; else
            git commit -m "BOUCLE: cycle $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main
            git push
          fi
