<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPC · Suivi de Statut</title>
<style>
  :root{
    --bg:#0a0e27; --bg2:#0d1230; --panel:#121838; --panel2:#171f45;
    --line:rgba(255,215,0,.14); --line2:rgba(255,255,255,.07);
    --gold:#ffd700; --gold-dim:#c9a92a; --gold-soft:rgba(255,215,0,.12);
    --txt:#eef1ff; --muted:#8b93bd; --muted2:#5b6390;
    --ok:#3ddc84; --warn:#ffb020; --err:#ff5470; --info:#5b8cff; --idle:#8b93bd;
    --shadow:0 20px 50px -20px rgba(0,0,0,.7);
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Consolas,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans); color:var(--txt); background:var(--bg);
    min-height:100vh; overflow-x:hidden; position:relative;
    background-image:
      radial-gradient(1200px 600px at 85% -10%, rgba(255,215,0,.08), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(91,140,255,.08), transparent 60%),
      linear-gradient(180deg,#0a0e27 0%,#090c22 100%);
  }
  /* ambient layers */
  .grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(var(--line2) 1px,transparent 1px),
      linear-gradient(90deg,var(--line2) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 75%);
            mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 75%);}
  .scan{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
    background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.18) 3px 4px);}
  .glow-orb{position:fixed;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none;opacity:.5}
  .orb1{width:420px;height:420px;top:-120px;right:-80px;background:radial-gradient(circle,rgba(255,215,0,.28),transparent 70%);animation:drift1 16s ease-in-out infinite}
  .orb2{width:380px;height:380px;bottom:-140px;left:-90px;background:radial-gradient(circle,rgba(91,140,255,.22),transparent 70%);animation:drift2 20s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,30px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,-30px)}}

  .app{position:relative;z-index:2;max-width:1320px;margin:0 auto;padding:22px 22px 60px}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;position:relative;
    background:linear-gradient(145deg,#1a2150,#0e1434);border:1px solid var(--line);box-shadow:var(--shadow)}
  .logo svg{width:30px;height:30px}
  .logo::after{content:"";position:absolute;inset:-1px;border-radius:14px;border:1px solid rgba(255,215,0,.4);animation:ring 3s ease-out infinite}
  @keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
  .brand h1{font-size:22px;font-weight:800;letter-spacing:.5px}
  .brand h1 b{color:var(--gold)}
  .brand .sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}

  .conn{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);font-family:var(--mono);font-size:12px}
  .conn .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.6s infinite}
  .conn.off .dot{background:var(--err);box-shadow:0 0 10px var(--err);animation:none}
  .conn .lbl{color:var(--muted)}
  .conn .val{color:var(--gold);font-weight:700}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* dashboard */
  .dash{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;margin-bottom:18px}
  .panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);
    border-radius:16px;padding:18px;position:relative;overflow:hidden}
  .panel::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6}
  .panel h2{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:8px;margin-bottom:16px;font-weight:700}
  .panel h2 .tag{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--gold);
    background:var(--gold-soft);padding:3px 8px;border-radius:6px;letter-spacing:1px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:14px;position:relative;overflow:hidden;transition:.25s}
  .kpi:hover{border-color:var(--line);transform:translateY(-2px)}
  .kpi .num{font-family:var(--mono);font-size:30px;font-weight:800;line-height:1;letter-spacing:-1px}
  .kpi .lbl{font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.5px}
  .kpi .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--gold);transition:width .8s ease}
  .kpi.k-ok .num{color:var(--ok)} .kpi.k-warn .num{color:var(--warn)}
  .kpi.k-err .num{color:var(--err)} .kpi.k-info .num{color:var(--info)}
  .kpi.k-ok .bar{background:var(--ok)} .kpi.k-warn .bar{background:var(--warn)}
  .kpi.k-err .bar{background:var(--err)} .kpi.k-info .bar{background:var(--info)}

  .ring-wrap{display:flex;align-items:center;gap:20px}
  .ring{position:relative;width:150px;height:150px;flex-shrink:0}
  .ring svg{transform:rotate(-90deg)}
  .ring .track{stroke:rgba(255,255,255,.06)}
  .ring .prog{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1);
    filter:drop-shadow(0 0 6px rgba(255,215,0,.5))}
  .ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ring .center .pct{font-family:var(--mono);font-size:34px;font-weight:800;color:var(--gold)}
  .ring .center .cap{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
  .legend{flex:1;display:flex;flex-direction:column;gap:9px}
  .leg{display:flex;align-items:center;gap:9px;font-size:12px}
  .leg .sw{width:11px;height:11px;border-radius:3px}
  .leg .nm{color:var(--txt)} .leg .ct{margin-left:auto;font-family:var(--mono);color:var(--muted)}

  /* toolbar */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:11px;
    padding:11px 14px 11px 38px;color:var(--txt);font-size:14px;font-family:var(--sans);transition:.2s}
  .search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
  .chip{background:var(--bg2);border:1px solid var(--line2);color:var(--muted);border-radius:11px;
    padding:10px 14px;font-size:13px;cursor:pointer;transition:.2s;font-family:var(--sans);display:flex;align-items:center;gap:7px}
  .chip:hover{border-color:var(--line);color:var(--txt)}
  .chip.active{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
  .chip .n{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.06);padding:1px 6px;border-radius:5px}
  .chip.active .n{background:rgba(255,215,0,.2)}
  .btn{background:linear-gradient(145deg,#2a3168,#1a2150);border:1px solid var(--line);color:var(--txt);
    border-radius:11px;padding:11px 16px;font-size:13px;cursor:pointer;font-weight:600;transition:.2s;
    display:flex;align-items:center;gap:8px;font-family:var(--sans)}
  .btn:hover{border-color:var(--gold);transform:translateY(-1px)}
  .btn.gold{background:linear-gradient(145deg,var(--gold),#e0b400);color:#0a0e27;border-color:var(--gold);
    box-shadow:0 8px 20px -8px rgba(255,215,0,.6)}
  .btn.gold:hover{filter:brightness(1.08)}
  .btn svg{width:16px;height:16px}

  /* list */
  .list{display:flex;flex-direction:column;gap:10px}
  .row{display:grid;grid-template-columns:1fr 150px 130px 150px 130px;gap:14px;align-items:center;
    background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line2);
    border-radius:13px;padding:14px 16px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
  .row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sc,#8b93bd);transition:.3s}
  .row:hover{border-color:var(--line);transform:translateX(3px);box-shadow:var(--shadow)}
  .row.open{border-color:var(--gold);background:linear-gradient(180deg,#182050,var(--bg2))}
  .row .name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px}
  .row .name .svc{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
  .row .name .ic{width:8px;height:8px;border-radius:50%;background:var(--sc,#8b93bd);box-shadow:0 0 8px var(--sc,#8b93bd);flex-shrink:0}
  .row .lat{font-family:var(--mono);font-size:13px;color:var(--txt);text-align:right}
  .row .lat .u{color:var(--muted);font-size:10px}
  .row .time{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
  .row .time .ago{color:var(--muted2)}
  .st-badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
    padding:6px 11px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line2)}
  .st-badge .d{width:8px;height:8px;border-radius:50%;background:var(--sc,#8b93bd);box-shadow:0 0 8px var(--sc,#8b93bd)}
  .st-badge.run .d{animation:pulse 1.4s infinite}
  .row .acts{display:flex;gap:6px;justify-content:flex-end}
  .iconbtn{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--line2);
    color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.2s}
  .iconbtn:hover{color:var(--gold);border-color:var(--gold);background:var(--gold-soft)}
  .iconbtn.del:hover{color:var(--err);border-color:var(--err);background:rgba(255,84,112,.1)}
  .iconbtn svg{width:15px;height:15px}

  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .empty svg{width:54px;height:54px;opacity:.4;margin-bottom:14px}
  .empty p{font-size:14px}

  /* detail */
  .detail{margin-top:16px;background:linear-gradient(180deg,var(--panel),var(--bg2));
    border:1px solid var(--line);border-radius:16px;padding:22px;position:relative;overflow:hidden;
    animation:slideIn .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes slideIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .detail::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .d-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .d-head .ttl{font-size:20px;font-weight:800;display:flex;align-items:center;gap:12px}
  .d-head .ttl .svc{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
  .d-head .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:16px;flex-wrap:wrap}
  .d-head .meta b{color:var(--txt)}
  .d-close{background:none;border:1px solid var(--line2);color:var(--muted);width:34px;height:34px;border-radius:9px;cursor:pointer;transition:.2s}
  .d-close:hover{color:var(--err);border-color:var(--err)}

  .d-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .d-block{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:16px}
  .d-block h3{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .d-block h3 svg{width:15px;height:15px;color:var(--gold)}

  .status-pick{display:flex;gap:8px;flex-wrap:wrap}
  .sp{flex:1;min-width:80px;text-align:center;padding:12px 8px;border-radius:10px;cursor:pointer;
    border:1px solid var(--line2);background:rgba(255,255,255,.02);transition:.2s;font-size:12px;font-weight:700;color:var(--muted)}
  .sp .d{width:9px;height:9px;border-radius:50%;margin:0 auto 7px;background:var(--sc);box-shadow:0 0 8px var(--sc)}
  .sp:hover{border-color:var(--sc);color:var(--txt);transform:translateY(-2px)}
  .sp.sel{background:var(--gold-soft);border-color:var(--sc);color:var(--txt)}
  .sp.sel .d{animation:pulse 1.4s infinite}

  .lat-input{display:flex;align-items:center;gap:10px}
  .lat-input input{flex:1;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;
    padding:11px 12px;color:var(--txt);font-family:var(--mono);font-size:15px;font-weight:700}
  .lat-input input:focus{outline:none;border-color:var(--gold)}
  .lat-input .unit{font-family:var(--mono);color:var(--muted);font-size:13px}
  .lat-bar{height:6px;background:rgba(255,255,255,.06);border-radius:4px;margin-top:12px;overflow:hidden}
  .lat-bar i{display:block;height:100%;border-radius:4px;transition:width .5s,background .5s}

  .log{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:6px}
  .log::-webkit-scrollbar{width:6px}
  .log::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .log-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
    padding:9px 11px;background:rgba(255,255,255,.02);border:1px solid var(--line2);border-radius:9px;
    font-family:var(--mono);font-size:11px;animation:slideIn .3s}
  .log-item .lt{color:var(--muted2)}
  .log-item .lm{color:var(--txt)}
  .log-item .ls{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px}
  .log-empty{color:var(--muted2);font-size:12px;text-align:center;padding:20px;font-family:var(--mono)}

  .d-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .d-actions .btn{flex:1;justify-content:center;min-width:130px}

  /* modal */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(5,8,24,.75);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex;animation:fade .25s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{width:100%;max-width:520px;background:linear-gradient(180deg,var(--panel),var(--bg2));
    border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow);
    animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
  .modal h2{font-size:18px;margin-bottom:4px}
  .modal .msub{font-size:12px;color:var(--muted);margin-bottom:20px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;font-weight:700}
  .field input,.field select{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;
    padding:12px 14px;color:var(--txt);font-size:14px;font-family:var(--sans);transition:.2s}
  .field input:focus,.field select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
  .field select{cursor:pointer}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .m-actions{display:flex;gap:10px;margin-top:22px}
  .m-actions .btn{flex:1;justify-content:center}

  /* toasts */
  .toasts{position:fixed;bottom:22px;right:22px;z-index:60;display:flex;flex-direction:column;gap:10px}
  .toast{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);
    border-radius:11px;padding:13px 16px;min-width:240px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:11px;animation:toastIn .35s cubic-bezier(.2,.9,.3,1.2)}
  .toast.out{animation:toastOut .3s forwards}
  .toast .ti{width:26px;height:26px;border-radius:7px;display:grid;place-items
