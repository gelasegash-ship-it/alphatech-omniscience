<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier — Productivité Locale</title>
<style>
  :root{
    --bg:#0a0e27;
    --bg-2:#0d1230;
    --panel:rgba(255,255,255,.035);
    --panel-2:rgba(255,255,255,.06);
    --line:rgba(255,215,0,.14);
    --line-soft:rgba(255,255,255,.08);
    --gold:#ffd700;
    --gold-2:#ffbf00;
    --gold-soft:rgba(255,215,0,.12);
    --ink:#eef1ff;
    --muted:#8b93c9;
    --muted-2:#5f6699;
    --good:#5fe3a1;
    --warn:#ff9f43;
    --bad:#ff5c7a;
    --shadow:0 24px 60px -20px rgba(0,0,0,.7);
    --r:16px;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 82% -10%, rgba(255,215,0,.10), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(90,120,255,.12), transparent 55%),
      linear-gradient(180deg,#0a0e27 0%, #090c22 100%);
    background-attachment:fixed;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* ambient layers */
  .bg-grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,215,0,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,215,0,.035) 1px,transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
    animation:drift 40s linear infinite;
  }
  @keyframes drift{to{background-position:46px 46px,46px 46px}}
  .glow{position:fixed;border-radius:50%;filter:blur(90px);z-index:0;pointer-events:none;opacity:.5}
  .glow.a{width:420px;height:420px;background:rgba(255,215,0,.16);top:-120px;right:-80px;animation:float1 14s ease-in-out infinite}
  .glow.b{width:380px;height:380px;background:rgba(90,120,255,.18);bottom:-140px;left:-100px;animation:float2 18s ease-in-out infinite}
  @keyframes float1{50%{transform:translate(-40px,50px) scale(1.1)}}
  @keyframes float2{50%{transform:translate(50px,-40px) scale(1.08)}}

  .app{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:22px 22px 60px}

  /* header */
  header{
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    padding:16px 20px;margin-bottom:22px;
    background:linear-gradient(120deg,rgba(255,215,0,.06),rgba(255,255,255,.02));
    border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);
    animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .brand{display:flex;align-items:center;gap:14px}
  .mark{
    width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
    background:radial-gradient(circle at 30% 25%,#fff6c8,#ffd700 45%,#b8860b);
    box-shadow:0 8px 22px -6px rgba(255,215,0,.6),inset 0 0 0 1px rgba(255,255,255,.4);
    font-size:24px;
  }
  .brand h1{font-size:22px;letter-spacing:.5px;font-weight:800}
  .brand h1 span{color:var(--gold)}
  .brand p{font-size:12px;color:var(--muted);letter-spacing:.4px}
  .clock{text-align:right}
  .clock .time{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:1px;color:var(--gold);text-shadow:0 0 22px rgba(255,215,0,.35)}
  .clock .date{font-size:12px;color:var(--muted);text-transform:capitalize}

  /* layout */
  .grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
  @media(max-width:920px){.grid{grid-template-columns:1fr}}

  .card{
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:var(--r);
    padding:18px;
    backdrop-filter:blur(6px);
    animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
  }
  .card + .card{margin-top:20px}
  .card h2{
    font-size:13px;text-transform:uppercase;letter-spacing:2px;color:var(--gold);
    display:flex;align-items:center;gap:9px;margin-bottom:14px;font-weight:800;
  }
  .card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
  .card h2 .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:0;text-transform:none}

  /* focus timer */
  .focus{position:relative;overflow:hidden}
  .focus::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(255,215,0,.12),transparent 60%);pointer-events:none}
  .ring-wrap{position:relative;width:230px;height:230px;margin:6px auto 4px}
  .ring{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:12}
  .ring .prog{fill:none;stroke:url(#goldgrad);stroke-width:12;stroke-linecap:round;
    filter:drop-shadow(0 0 8px rgba(255,215,0,.6));transition:stroke-dashoffset .6s ease}
  .ring-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ring-center .big{font-family:var(--mono);font-size:46px;font-weight:800;letter-spacing:1px;line-height:1}
  .ring-center .lbl{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .focus-task{
    text-align:center;font-size:15px;font-weight:600;margin:10px 0 14px;min-height:20px;
    color:var(--ink);
  }
  .focus-task em{color:var(--gold);font-style:normal}
  .modes{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
  .mode{
    flex:1;padding:9px 6px;border-radius:11px;border:1px solid var(--line-soft);
    background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;
    transition:.2s;letter-spacing:.5px;
  }
  .mode:hover{color:var(--ink);border-color:var(--line)}
  .mode.active{background:var(--gold-soft);color:var(--gold);border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(255,215,0,.3)}
  .mode small{display:block;font-weight:500;opacity:.7;font-size:10px;margin-top:2px}
  .ctrl{display:flex;gap:10px}
  .btn{
    flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,215,0,.16),rgba(255,215,0,.05));
    color:var(--gold);font-weight:800;font-size:14px;cursor:pointer;letter-spacing:.5px;
    transition:.18s;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px rgba(255,215,0,.5)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{background:transparent;color:var(--muted);border-color:var(--line-soft);flex:0 0 auto;padding:13px 16px}
  .btn.ghost:hover{color:var(--ink);box-shadow:none}
  .focus-meta{display:flex;justify-content:space-between;margin-top:14px;font-size:12px;color:var(--muted)}
  .focus-meta b{color:var(--gold);font-family:var(--mono)}

  /* tasks */
  .add-row{display:flex;gap:8px;margin-bottom:14px}
  input,select,textarea{
    font-family:inherit;font-size:14px;color:var(--ink);
    background:rgba(0,0,0,.25);border:1px solid var(--line-soft);border-radius:11px;
    padding:11px 12px;outline:none;transition:.18s;width:100%;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,215,0,.15)}
  input::placeholder{color:var(--muted-2)}
  .add-row .go{flex:0 0 auto;padding:0 16px;border-radius:11px;border:none;background:var(--gold);color:#1a1400;font-weight:800;cursor:pointer;transition:.18s}
  .add-row .go:hover{background:#ffe14d;box-shadow:0 8px 20px -8px rgba(255,215,0,.7)}
  .filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .chip{font-size:11px;padding:6px 11px;border-radius:20px;border:1px solid var(--line-soft);background:transparent;color:var(--muted);cursor:pointer;transition:.18s;font-weight:600}
  .chip:hover{color:var(--ink)}
  .chip.active{background:var(--gold-soft);color:var(--gold);border-color:var(--gold)}
  .task-list{display:flex;flex-direction:column;gap:9px;max-height:340px;overflow:auto;padding-right:4px}
  .task-list::-webkit-scrollbar{width:8px}
  .task-list::-webkit-scrollbar-thumb{background:rgba(255,215,0,.25);border-radius:8px}
  .task{
    display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;
    background:rgba(255,255,255,.02);border:1px solid var(--line-soft);
    transition:.18s;animation:pop .3s ease both;
  }
  @keyframes pop{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  .task:hover{border-color:var(--line);background:rgba(255,215,0,.04)}
  .task.done{opacity:.5}
  .task.done .t-title{text-decoration:line-through;color:var(--muted)}
  .check{
    width:22px;height:22px;flex:0 0 auto;border-radius:7px;border:2px solid var(--line);
    cursor:pointer;display:grid;place-items:center;transition:.18s;background:transparent;
  }
  .check:hover{border-color:var(--gold)}
  .task.done .check{background:var(--gold);border-color:var(--gold);box-shadow:0 0 12px rgba(255,215,0,.5)}
  .check svg{width:13px;height:13px;stroke:#1a1400;stroke-width:3;fill:none;opacity:0;transition:.18s}
  .task.done .check svg{opacity:1}
  .t-body{flex:1;min-width:0}
  .t-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center}
  .tag{padding:1px 7px;border-radius:6px;background:rgba(255,255,255,.06);font-size:10px}
  .prio{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .prio.h{background:var(--bad);box-shadow:0 0 8px var(--bad)}
  .prio.m{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .prio.l{background:var(--good);box-shadow:0 0 8px var(--good)}
  .t-del{opacity:0;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:4px;transition:.18s}
  .task:hover .t-del{opacity:1}
  .t-del:hover{color:var(--bad)}
  .empty{text-align:center;color:var(--muted-2);font-size:13px;padding:26px 0}

  /* right column */
  .right{display:flex;flex-direction:column}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stat{
    background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:15px;
    position:relative;overflow:hidden;transition:.2s;
  }
  .stat:hover{transform:translateY(-3px);border-color:var(--line)}
  .stat .n{font-family:var(--mono);font-size:30px;font-weight:800;color:var(--gold);line-height:1}
  .stat .l{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.4px}
  .stat .bar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);margin-top:11px;overflow:hidden}
  .stat .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-2),var(--gold));border-radius:5px;transition:width .6s ease}

  .daybar{margin-top:12px}
  .daybar .top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}
  .daybar .top b{color:var(--gold);font-family:var(--mono)}
  .daybar .track{height:12px;border-radius:8px;background:rgba(255,255,255,.06);overflow:hidden;border:1px solid var(--line-soft)}
  .daybar .fill{height:100%;background:linear-gradient(90deg,#ffbf00,#ffd700 60%,#fff2a8);border-radius:8px;transition:width .5s ease;box-shadow:0 0 14px rgba(255,215,0,.4)}

  .chart{display:flex;align-items:flex-end;gap:9px;height:150px;padding-top:10px}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
  .col .bar{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--gold),rgba(255,215,0,.35));min-height:4px;transition:height .6s cubic-bezier(.2,.8,.2,1);position:relative}
  .col .bar .v{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--gold);font-weight:700}
  .col .d{font-size:10px;color:var(--muted);letter-spacing:1px}
  .col.today .bar{box-shadow:0 0 16px rgba(255,215,0,.5)}
  .col.today .d{color:var(--gold);font-weight:700}

  .habits{display:flex;flex-direction:column;gap:10px}
  .habit{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.02);border:1px solid var(--line-soft);transition:.18s}
  .habit:hover{border-color:var(--line)}
  .h-name{flex:1;font-size:14px;font-weight:600}
  .h-streak{font-family:var(--mono);font-size:12px;color:var(--gold);white-space:nowrap}
  .h-streak span{color:var(--muted);font-size:10px}
  .h-dots{display:flex;gap:4px}
  .h-dot{width:14px;height:14px;border-radius:5px;background:rgba(255,255,255,.08);cursor:pointer;transition:.15s;border:1px solid transparent}
  .h-dot.on{background:var(--gold);box-shadow:0 0 8px rgba(255,215,0,.5)}
  .h-dot:hover{transform:scale(1.15)}
  .h-del{border:none;background:transparent;color:var(--muted-2);cursor:pointer;font-size:15px;opacity:0;transition:.18s}
  .habit:hover .h-del{opacity:1}
  .h-del:hover{color:var(--bad)}
  .add-habit{display:flex;gap:8px;margin-top:12px}
  .add-habit .go{flex:0 0 auto;padding:0 14px;border-radius:11px;border:none;background:var(--gold);color:#1a1400;font-weight:800;cursor:pointer}

  .notes textarea{min-height:120px;resize:vertical;line-height:1.6}
  .notes .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--muted-2)}
  .notes .foot .save{color:var(--good);opacity:0;transition:.3s}
  .notes .foot .save.show{opacity:1}

  /* toast */
  .toast{
    position:fixed;bottom:26px;left:50%;transform:translate(-50%,120px);
    background:linear-gradient(180deg,#1a1f45,#0d1230);border:1px solid var(--gold);
    color:var(--ink);padding:13px 22px;border-radius:14px;font-size:14px;font-weight:600;
    box-shadow:0 20px 40px -12px rgba(0,0,0,.7),0 0 24px rgba(255,215,0,.25);
    z-index:50;transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:10px;
  }
  .toast.show{transform:translate(-50%,0)}
  .toast .ic{color:var(--gold);font-size:18px}

  footer{margin-top:26px;text-align:center;font-size:11px;color:var(--muted-2);letter-spacing:.5px}
  footer b{color:var(--gold)}
  .reset{background:none;border:none;color:var(--muted-2);cursor:pointer;text-decoration:underline;font-size:11px;margin-left:6px}
  .reset:hover{color:var(--bad)}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="glow a"></div>
<div class="glow b"></div>

<div class="app">
  <header>
    <div class="brand">
      <div class="mark">⚡</div>
      <div>
        <h1>ATELIER<span>.</span></h1>
        <p>Productivité locale · 100% hors-ligne</p>
      </div>
    </div>
    <div class="clock">
      <div class="time" id="time">--:--:--</div>
      <div class="date" id="date">—</div>
    </div>
  </header>

  <div class="grid">
    <!-- LEFT -->
    <div class="left">
      <div class="card focus">
        <h2><span class="dot"></span>Focus Pomodoro</h2>
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 230 230">
            <defs>
              <linearGradient id="goldgrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fff2a8"/>
                <stop offset="1" stop-color="#ffbf00"/>
              </linearGradient>
            </defs>
            <circle class="track" cx="115" cy="115" r="100"/>
            <circle class="prog" id="prog" cx="115" cy="115" r="100"/>
          </svg>
          <div class="ring-center">
            <div class="big" id="timer">25:00</div>
            <div class="lbl" id="timerLbl">Concentration</div>
          </div>
        </div>
        <div class="focus-task
