<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALPHATECH Doc-Engine</title>
<style>
:root{
  --bg:#0a0e27;
  --bg2:#0d1330;
  --panel:#11173a;
  --panel2:#161d47;
  --line:rgba(255,215,0,.14);
  --line2:rgba(255,255,255,.08);
  --gold:#ffd700;
  --gold2:#ffcf40;
  --gold-dim:rgba(255,215,0,.55);
  --ink:#eef1ff;
  --muted:#8b93c4;
  --muted2:#5c6496;
  --ok:#4ade80;
  --warn:#fbbf24;
  --bad:#f87171;
  --mono:'SFMono-Regular',ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace;
  --disp:'Bahnschrift','DIN Alternate','Oswald','Arial Narrow',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 700px at 82% -10%, rgba(255,215,0,.10), transparent 60%),
    radial-gradient(900px 700px at -10% 110%, rgba(60,90,255,.10), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.5;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 40%,#000 30%,transparent 85%);
}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,215,0,.22);border-radius:20px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,215,0,.45);background-clip:padding-box}

/* ---------- LAYOUT ---------- */
.app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column}

/* ---------- TOPBAR ---------- */
.topbar{
  display:flex;align-items:center;gap:18px;
  padding:12px 20px;
  background:linear-gradient(180deg,rgba(22,29,71,.9),rgba(13,19,48,.75));
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px);
  position:relative;
}
.topbar::after{
  content:"";position:absolute;left:0;bottom:-1px;height:2px;width:100%;
  background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent);
  opacity:.5;
}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand .mark{
  width:42px;height:42px;border-radius:11px;position:relative;flex-shrink:0;
  background:linear-gradient(150deg,#1a2150,#0c1130);
  border:1px solid var(--gold-dim);
  display:grid;place-items:center;
  box-shadow:0 0 22px rgba(255,215,0,.25),inset 0 0 14px rgba(255,215,0,.12);
}
.brand .mark svg{width:24px;height:24px}
.brand .txt .t1{font-family:var(--disp);font-weight:700;letter-spacing:.14em;font-size:17px;line-height:1;color:var(--gold);text-transform:uppercase}
.brand .txt .t2{font-family:var(--mono);font-size:10.5px;letter-spacing:.34em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.brand .txt .t2 b{color:var(--ink);font-weight:600}

.search{
  flex:1;max-width:520px;position:relative;display:flex;align-items:center;
  background:rgba(8,11,32,.7);border:1px solid var(--line2);border-radius:11px;
  padding:0 12px;height:44px;transition:.2s;
}
.search:focus-within{border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(255,215,0,.12)}
.search svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.search input{
  flex:1;background:none;border:none;outline:none;color:var(--ink);
  font-family:var(--body);font-size:14.5px;padding:0 10px;
}
.search input::placeholder{color:var(--muted2)}
.search .kbd{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  border:1px solid var(--line2);border-radius:6px;padding:2px 7px;background:rgba(255,255,255,.03);
}
.top-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.status{
  display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;
  letter-spacing:.12em;color:var(--muted);text-transform:uppercase;
  padding:7px 12px;border:1px solid var(--line2);border-radius:20px;background:rgba(255,255,255,.02);
}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

.btn{
  font-family:var(--body);font-weight:600;font-size:13.5px;cursor:pointer;
  border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--ink);
  padding:10px 16px;border-radius:10px;display:inline-flex;align-items:center;gap:8px;
  transition:.18s;white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:var(--gold-dim);background:rgba(255,215,0,.06);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.gold{
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1400;border:none;
  box-shadow:0 6px 18px rgba(255,215,0,.28);
}
.btn.gold:hover{box-shadow:0 8px 26px rgba(255,215,0,.42);filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--bad);color:var(--bad);background:rgba(248,113,113,.08)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:9px;border-radius:9px}

/* ---------- BODY ---------- */
.body{flex:1;display:flex;min-height:0}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:300px;flex-shrink:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(17,23,58,.6),rgba(13,19,48,.4));
  border-right:1px solid var(--line);min-height:0;
}
.side-head{padding:16px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.side-head h3{font-family:var(--disp);letter-spacing:.16em;font-size:13px;text-transform:uppercase;color:var(--muted);font-weight:600}
.side-head .count{font-family:var(--mono);font-size:11px;color:var(--gold);background:rgba(255,215,0,.1);padding:2px 8px;border-radius:20px}
.tree{flex:1;overflow-y:auto;padding:4px 10px 20px;min-height:0}
.node{position:relative}
.node-row{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;
  transition:.14s;user-select:none;position:relative;
}
.node-row:hover{background:rgba(255,255,255,.04)}
.node-row.active{background:rgba(255,215,0,.1);box-shadow:inset 2px 0 0 var(--gold)}
.node-row.active .node-name{color:var(--gold)}
.node-toggle{width:16px;height:16px;display:grid;place-items:center;color:var(--muted);flex-shrink:0;transition:.2s}
.node-toggle svg{width:12px;height:12px}
.node.open>.node-row .node-toggle{transform:rotate(90deg);color:var(--gold)}
.node-ico{width:18px;height:18px;color:var(--muted);flex-shrink:0;display:grid;place-items:center}
.node-ico svg{width:16px;height:16px}
.node-row.active .node-ico{color:var(--gold)}
.node-name{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-badge{font-family:var(--mono);font-size:10px;color:var(--muted2);background:rgba(255,255,255,.04);padding:1px 6px;border-radius:10px}
.node-children{margin-left:14px;border-left:1px solid var(--line2);padding-left:4px;overflow:hidden;max-height:0;transition:max-height .25s ease}
.node.open>.node-children{max-height:1200px}
.empty-tree{padding:30px 16px;text-align:center;color:var(--muted2);font-size:13px}
.empty-tree svg{width:40px;height:40px;opacity:.4;margin-bottom:10px}

/* ---------- MAIN ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{
  display:flex;align-items:center;gap:10px;padding:12px 18px;
  border-bottom:1px solid var(--line2);background:rgba(13,19,48,.4);flex-wrap:wrap;
}
.tabs{display:flex;gap:4px;background:rgba(8,11,32,.6);padding:4px;border-radius:11px;border:1px solid var(--line2)}
.tab{
  font-family:var(--body);font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);
  padding:7px 16px;border-radius:8px;transition:.16s;border:none;background:none;
}
.tab:hover{color:var(--ink)}
.tab.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1400;box-shadow:0 3px 12px rgba(255,215,0,.3)}
.toolbar .spacer{flex:1}
.breadcrumb{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.breadcrumb b{color:var(--gold)}
.breadcrumb .sep{color:var(--muted2)}

.content{flex:1;overflow-y:auto;min-height:0;position:relative}

/* ---------- EMPTY STATE ---------- */
.empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px;gap:8px;
}
.empty .ring{
  width:120px;height:120px;border-radius:50%;position:relative;margin-bottom:20px;
  border:1px dashed var(--gold-dim);display:grid;place-items:center;
  animation:spin 24s linear infinite;
}
.empty .ring::before{content:"";position:absolute;inset:14px;border-radius:50%;border:1px solid var(--line2)}
.empty .ring svg{width:46px;height:46px;color:var(--gold);animation:spin 24s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.empty h2{font-family:var(--disp);font-size:30px;letter-spacing:.06em;font-weight:700}
.empty p{color:var(--muted);max-width:420px;font-size:14.5px}
.empty .row{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;justify-content:center}

/* ---------- DOC VIEW ---------- */
.doc{max-width:860px;margin:0 auto;padding:34px 40px 80px;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.doc-head{margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.doc-kicker{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.doc-kicker .line{flex:1;height:1px;background:var(--line)}
.doc-title{font-family:var(--disp);font-size:44px;font-weight:700;line-height:1.05;letter-spacing:.01em}
.doc-sub{color:var(--muted);font-size:16px;margin-top:10px;max-width:640px}
.doc-meta{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.chip{
  font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--ink);
  background:rgba(255,255,255,.04);border:1px solid var(--line2);padding:5px 11px;border-radius:20px;
  display:inline-flex;align-items:center;gap:6px;
}
.chip svg{width:13px;height:13px;color:var(--gold)}
.chip .v{color:var(--gold)}
.doc-body{font-size:16px;line-height:1.75;color:#d7dcf5}
.doc-body h2{font-family:var(--disp);font-size:26px;font-weight:700;margin:34px 0 14px;letter-spacing:.02em;color:var(--ink);display:flex;align-items:center;gap:12px}
.doc-body h2::before{content:"";width:22px;height:3px;background:var(--gold);border-radius:2px;flex-shrink:0}
.doc-body h3{font-family:var(--disp);font-size:19px;font-weight:600;margin:26px 0 10px;color:var(--gold2);letter-spacing:.02em}
.doc-body p{margin:0 0 16px}
.doc-body ul,.doc-body ol{margin:0 0 18px 4px;list-style:none}
.doc-body li{position:relative;padding-left:26px;margin-bottom:9px}
.doc-body ul li::before{content:"";position:absolute;left:6px;top:10px;width:7px;height:7px;background:var(--gold);border-radius:2px;transform:rotate(45deg)}
.doc-body ol{counter-reset:n}
.doc-body ol li{counter-increment:n}
.doc-body ol li::before{content:counter(n);position:absolute;left:0;top:1px;font-family:var(--mono);font-size:12px;color:var(--gold);font-weight:700;width:18px;text-align:center}
.doc-body code{font-family:var(--mono);font-size:13.5px;background:rgba(255,215,0,.08);color:var(--gold2);padding:2px 7px;border-radius:5px;border:1px solid rgba(255,215,0,.15)}
.doc-body .callout{
  border:1px solid var(--line);border-left:3px solid var(--gold);
  background:rgba(255,215,0,.04);padding:16px 18px;border-radius:0 10px 10px 0;margin:18px 0;
}
.doc-body .callout .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.doc-body .callout p{margin:0}
.doc-body table{width:100%;border-collapse:collapse;margin:18px 0;font-size:14px}
.doc-body th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(255,215,0,.04)}
.doc-body td{padding:10px 12px;border-bottom:1px solid var(--line2);color:#c9cfee}
.doc-body .kv{display:grid;grid-template-columns:180px 1fr;gap:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin:18px 0}
.doc-body .kv div{padding:11px 14px;border-bottom:1px solid var(--line2);font-size:14px}
.doc-body .kv div:nth-child(odd){background:rgba(255,255,255,.02);color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.doc-body .kv div:nth-child(even){color:var(--ink)}
.doc-body .kv div:nth-last-child(-n+2){border-bottom:none}

/* ---------- EDITOR ---------- */
.editor{max-width:900px;margin:0 auto;padding:30px 40px 80px;animation:fadeUp .4s ease}
.ed-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px}
.ed-top .grow{flex:1}
.ed-title{
  width:100%;background:none;border:none;outline:none;color:var(--ink);
  font-family:var(--disp);font-size:34px;font-weight:700;letter-spacing:.01em;padding:4px 0;
  border-bottom:1px solid transparent;transition:.2s;
}
.ed-title:focus{border-bottom-color:var(--gold-dim)}
.ed-sub{
  width:100%;background:none;border:none;outline:none;color:var(--muted);
  font-family:var(--body);font-size:15px;padding:8px 0 0;
}
.ed-sub:focus{color:var(--ink)}
.ed-bar{
  display:flex;gap:4px;flex-wrap:wrap;padding:8px;margin-bottom:14px;
  background:rgba(8,11,32,.6);border:1px solid var(--line2);border-radius:11px;
  position:sticky;top:0;z-index:5;
}
.ed-bar .grp{display:flex;gap:3px;padding-right:8px;margin-right:8px;border-right:1px solid var(--line2)}
.ed-bar .grp:last-child{border:none;margin:0;padding:0}
.ed-btn{
  font-family:var(--mono);font-size:13px;cursor:pointer;color:var(--muted);
  background:none;border:1px solid transparent;border-radius:7px;padding:6px 10px;transition:.14s;min-width:34px;
}
.ed-btn:hover{color:var(--gold);background:rgba(255,215,0,.08);border-color:var(--line)}
.ed-btn b{font-weight:700}
.ed-btn i{font-style:italic}
.ed-btn u{text-decoration:underline}
.ed-area{
  width:100%;min-height:340px;background:rgba(8,11,32,.5);border:1px solid var(--line2);
  border-radius:12px;padding:20px 22px;color:#d7dcf5;font-family:var(--body);font-size:15px;
  line-height:1.75;outline:none;resize:vertical;transition:.2s;
}
.ed-area:focus{border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(255,215,0,.1)}
.ed-foot{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
.ed-foot .hint{font-family:var(--mono);font-size:11.5px;color:var(--muted2)}
.ed-foot .hint b{color:var(--gold)}
.ed-foot .spacer{flex:1}
.ed-foot .save-state{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.ed-foot .save-state .d{width:7px;height:7px;border-radius:50%;background:var(--muted2)}
.ed-foot .save-state.saved .d{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.ed-foot .save-state.dirty .d{background:var(--warn);box-shadow:0 0 8px var(--warn)}

/* ---------- STATS ---------- */
.stats{max-width:1000px;margin:0 auto;padding:34px 40px 80px;animation:fadeUp .4s ease}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}
.stat{
  background:linear-gradient(160deg,rgba(22,29,71,.7),rgba(13,19,48,.5));
  border:1px solid var(--line);border-radius:14px;padding:20px;position:relative;overflow:hidden;
  transition:.2s;
}
.stat:hover{transform:translateY(-3px);border-color:var(--gold-dim);box-shadow:0 12px 30px rgba(0,0,0,.3)}
.stat::before{content:"";position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.stat .num{font-family:var(--disp);font-size:40px;font-weight:700;color:var(--gold);line-height:1}
.stat .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.stat .sub{font-size:12px;color:var(--muted2);margin-top:4px}
.panel{
